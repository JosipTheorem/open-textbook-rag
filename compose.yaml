name: open-textbook-rag

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: open-textbook-rag-postgres:pg17-vector-http
    depends_on:
      ollama-embeddings:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-textbook_rag}
      POSTGRES_USER: ${POSTGRES_USER:-textbook_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ollama-embeddings:
    image: ollama/ollama:0.34.2
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_embedding_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_embedding_models:
